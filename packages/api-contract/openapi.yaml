openapi: 3.1.0
info:
  title: Compound App API
  version: 1.1.0-mvp
  summary: Shared API for the resident mobile app (/app/v1) and the compound-owner admin portal (/admin/v1).
  description: |
    Contract-first (ADR-006). Conventions:
    - JSON, camelCase fields, ISO 8601 UTC timestamps (`2026-11-02T06:00:00Z`). Clients render Asia/Riyadh, Gregorian + Hijri.
    - Errors: RFC 9457 `application/problem+json` with stable `code` (see Problem schema); clients localise by `code`.
    - Lists: cursor pagination (`cursor`, `limit`) except the admin Units list which uses page numbers (A1-AC5).
    - Mutating resident calls that create resources accept `Idempotency-Key` (uuid).
    - Optimistic concurrency on requests: send `expectedVersion`; `409 version_conflict` if stale.
    - Accept-Language: `ar` | `en` selects language for server-rendered text (notification titles, category names).
    - Resident app sends `X-App-Version: <semver>` on every /app/v1 call; below the minimum in `GET /app/v1/meta` the API answers `426 app_update_required` (v1.1).
    - Bearer tokens travel only in the `Authorization` header — never in a query string, including the SSE stream (v1.1, build review B6).
    - Deep links use the `compoundapp://` scheme (v1.1). The app still accepts legacy `compound://` until app 1.1.

    v1.1.0 (2026-11-01, additive only — decisions in the Architect build review 2026-11-01): PATCH /admin/v1/me,
    POST /admin/v1/me/password, GET /admin/v1/units/summary, X-CSRF-Token header on getAdminMe, GET /app/v1/meta,
    426 app_update_required, InvitationPreview.compoundPhone, ResidentMe.consent, 422 visit_in_past, deep-link scheme.
servers:
  - url: https://api.compound.example.sa
    description: Production (GCP me-central2)
  - url: https://api.staging.compound.example.sa
    description: Staging
tags:
  - name: Admin Auth
  - name: Admin Compound
  - name: Admin Units
  - name: Admin Requests
  - name: Admin Announcements
  - name: Admin Audit
  - name: App Activation
  - name: App Auth
  - name: App Profile
  - name: App Requests
  - name: App Announcements
  - name: App Notifications
  - name: App Privacy
  - name: Shared
  - name: Webhooks

security: []

paths:
  # ═══════════════════════ ADMIN — AUTH (A0) ═══════════════════════
  /admin/v1/auth/login:
    post:
      operationId: postAdminAuthLogin
      tags: [Admin Auth]
      summary: Step 1 — email + password. Sends a 2FA code (A0-AC1/AC2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Password OK; OTP sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '401': { $ref: '#/components/responses/Problem' }
        '423': { description: Account locked for 15 min after 5 failures (A0-AC3), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/v1/auth/mfa/verify:
    post:
      operationId: postAdminAuthMfaVerify
      tags: [Admin Auth]
      summary: Step 2 — verify OTP; sets `__Host-cs_admin` session cookie and returns the CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { schema: { type: string }, description: '__Host-cs_admin=…; Secure; HttpOnly; SameSite=Strict; Path=/' }
          content:
            application/json:
              schema:
                type: object
                required: [admin, csrfToken]
                properties:
                  admin: { $ref: '#/components/schemas/AdminMe' }
                  csrfToken: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/v1/auth/mfa/resend:
    post:
      operationId: postAdminAuthMfaResend
      summary: Post Admin Auth Mfa Resend
      tags: [Admin Auth]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challengeId], properties: { challengeId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: Resent, content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/v1/auth/logout:
    post:
      operationId: postAdminAuthLogout
      summary: Post Admin Auth Logout
      tags: [Admin Auth]
      security: [{ adminSession: [] }]
      responses: { '204': { description: Session revoked } }
  /admin/v1/auth/password/forgot:
    post:
      operationId: postAdminAuthPasswordForgot
      tags: [Admin Auth]
      summary: Always 202 (no account enumeration). Emails a 30-min reset link (A0-AC4).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '202': { description: Accepted } }
  /admin/v1/auth/password/reset:
    post:
      operationId: postAdminAuthPasswordReset
      summary: Post Admin Auth Password Reset
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/v1/me:
    get:
      operationId: getAdminMe
      summary: Get Admin Me
      tags: [Admin Auth]
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: OK
          headers:
            X-CSRF-Token: { description: 'Synchroniser token for this session; send it on every mutating /admin/v1 call (v1.1).', schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchAdminMe
      summary: Change the admin's own portal language (v1.1).
      tags: [Admin Auth]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [locale], properties: { locale: { $ref: '#/components/schemas/Locale' } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/v1/me/password:
    post:
      operationId: postAdminMePassword
      summary: Change own password while signed in; revokes all other sessions of this admin (v1.1).
      tags: [Admin Auth]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 128 }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: 'Password changed; other sessions revoked, this one kept' }
        '400': { description: 'code=current_password_invalid | validation_failed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }

  # ═══════════════════════ ADMIN — COMPOUND SETTINGS ═══════════════════════
  /admin/v1/compound:
    get:
      operationId: getAdminCompound
      summary: Get Admin Compound
      tags: [Admin Compound]
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Compound' } } } }
    patch:
      operationId: patchAdminCompound
      summary: Patch Admin Compound
      tags: [Admin Compound]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nameAr: { type: string, maxLength: 120 }
                nameEn: { type: string, maxLength: 120 }
                contactPhone: { $ref: '#/components/schemas/PhoneInput' }
                logoUploadId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Compound' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  # ═══════════════════════ ADMIN — UNITS (A1) & OWNERS/INVITES (A2) ═══════════════════════
  /admin/v1/units:
    get:
      operationId: getAdminUnits
      summary: Get Admin Units
      tags: [Admin Units]
      security: [{ adminSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Unit number, owner name or phone' }
        - { name: block, in: query, schema: { type: string } }
        - { name: activation, in: query, schema: { $ref: '#/components/schemas/ActivationStatus' } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [50], default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UnitSummary' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      operationId: postAdminUnits
      summary: Post Admin Units
      tags: [Admin Units]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } } }
        '409': { description: 'code=unit_number_taken (A1-AC2)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/v1/units/summary:
    get:
      operationId: getAdminUnitsSummary
      tags: [Admin Units]
      summary: Unit counters for the Units page header (v1.1).
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, active, inactive, assigned, unassigned, pendingInvitations]
                properties:
                  total: { type: integer }
                  active: { type: integer }
                  inactive: { type: integer }
                  assigned: { type: integer, description: Units with an active owner assignment }
                  unassigned: { type: integer }
                  pendingInvitations: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/v1/units/blocks:
    get:
      operationId: getAdminUnitsBlocks
      tags: [Admin Units]
      summary: Distinct block names (filters and announcement audience).
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { block: { type: string }, unitCount: { type: integer }, activeResidentCount: { type: integer } } } } } } }
  /admin/v1/units/{unitId}:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    get:
      operationId: getAdminUnitsByUnitId
      summary: Get Admin Units By Unit Id
      tags: [Admin Units]
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchAdminUnitsByUnitId
      summary: Patch Admin Units By Unit Id
      description: |
        Setting `status=inactive` (v1.1 clarification) in one transaction revokes the active owner assignment
        (`revoke_reason=unit_deactivated`), expires pending invitations and writes audit `unit.deactivate`.
        Requests stay visible and actionable for the admin; the resident loses access to the unit.
      tags: [Admin Units]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAdminUnitsByUnitId
      tags: [Admin Units]
      summary: Hard delete only if the unit never had an owner or requests; otherwise 409 code=unit_in_use (use PATCH status=inactive).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/v1/units/{unitId}/owner:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    put:
      operationId: putAdminUnitsByUnitIdOwner
      tags: [Admin Units]
      summary: Assign or change the unit owner (A2-AC1, AC6). Changing revokes the previous assignment and its sessions for this unit.
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerInput' } } }
      responses:
        '200': { description: 'Assigned (status=invited; no invite sent yet)', content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAdminUnitsByUnitIdOwner
      tags: [Admin Units]
      summary: Revoke the current owner without assigning a new one.
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '204': { description: Revoked } }
  /admin/v1/units/{unitId}/invitations:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    get:
      operationId: getAdminUnitsByUnitIdInvitations
      tags: [Admin Units]
      summary: Invitation history with per-channel delivery status (A2-AC4).
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } }
    post:
      operationId: postAdminUnitsByUnitIdInvitations
      tags: [Admin Units]
      summary: Send or resend the activation link (A2-AC2..AC5). Supersedes any previous link. Max 5 per unit per 24 h.
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [sms, email] } }
      responses:
        '201': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '409': { description: 'code=no_owner_assigned | already_active | channel_unavailable', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { description: 'code=invite_limit_reached', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/v1/units/{unitId}/requests:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    get:
      operationId: getAdminUnitsByUnitIdRequests
      tags: [Admin Units]
      summary: Request history of a unit, including previous owners' requests (Q-7).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRequestPage' } } } }

  # ═══════════════════════ ADMIN — REQUESTS (A3, A4) ═══════════════════════
  /admin/v1/requests:
    get:
      operationId: getAdminRequests
      summary: Get Admin Requests
      tags: [Admin Requests]
      security: [{ adminSession: [] }]
      parameters:
        - { name: status, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/RequestStatus' } } }
        - { name: reopened, in: query, schema: { type: boolean } }
        - { name: category, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/CategoryCode' } } }
        - { name: unitId, in: query, schema: { type: string, format: uuid } }
        - { name: block, in: query, schema: { type: string } }
        - { name: createdFrom, in: query, schema: { type: string, format: date } }
        - { name: createdTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'REQ-00123, unit number, or text' }
        - { name: sort, in: query, schema: { type: string, enum: [new_first, created_desc, created_asc, updated_desc], default: new_first } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time }, description: Polling fallback (ADR-007) }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRequestPage' } } } }
  /admin/v1/requests/counters:
    get:
      operationId: getAdminRequestsCounters
      tags: [Admin Requests]
      summary: Dashboard counters (A3-AC2).
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [new, inProgress, doneAwaitingConfirmation, reopened]
                properties:
                  new: { type: integer }
                  inProgress: { type: integer }
                  doneAwaitingConfirmation: { type: integer }
                  reopened: { type: integer }
  /admin/v1/requests/{requestId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAdminRequestsByRequestId
      summary: Get Admin Requests By Request Id
      tags: [Admin Requests]
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRequestDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/v1/requests/{requestId}/transitions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: postAdminRequestsByRequestIdTransitions
      tags: [Admin Requests]
      summary: Change status along allowed admin transitions only (new→in_progress, new→done, in_progress→done).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, expectedVersion]
              properties:
                to: { type: string, enum: [in_progress, done] }
                expectedVersion: { type: integer }
      responses:
        '200': { description: Transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRequestDetail' } } } }
        '409': { description: 'code=invalid_transition | version_conflict', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/v1/requests/{requestId}/comments:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: postAdminRequestsByRequestIdComments
      tags: [Admin Requests]
      summary: Add comment and/or schedule or reschedule a visit (A4). Not allowed when closed or cancelled.
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                visit: { $ref: '#/components/schemas/VisitWindowInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RequestEvent' } } } }
        '409': { description: 'code=request_closed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'code=validation_failed | visit_in_past (visit start must be later than now, Asia/Riyadh; endTime after startTime)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/v1/requests/{requestId}/comments/{eventId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: patchAdminRequestsByRequestIdCommentsByEventId
      tags: [Admin Requests]
      summary: Edit own comment text within 5 minutes (A4-AC6).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 1000 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequestEvent' } } } }
        '409': { description: 'code=edit_window_closed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteAdminRequestsByRequestIdCommentsByEventId
      tags: [Admin Requests]
      summary: Delete own comment within 5 minutes (soft delete; audit kept).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }

  # ═══════════════════════ ADMIN — ANNOUNCEMENTS (A5) ═══════════════════════
  /admin/v1/announcements:
    get:
      operationId: getAdminAnnouncements
      summary: Get Admin Announcements
      tags: [Admin Announcements]
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminAnnouncement' } }
                  nextCursor: { type: [string, 'null'] }
    post:
      operationId: postAdminAnnouncements
      tags: [Admin Announcements]
      summary: Create and send now (`scheduledAt` null) or schedule (A5-AC1..AC4).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAnnouncement' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/v1/announcements/audience-preview:
    post:
      operationId: postAdminAnnouncementsAudiencePreview
      tags: [Admin Announcements]
      summary: Recipient count and SMS count before sending (A5-AC3 counter).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience: { $ref: '#/components/schemas/Audience' }
                sendSms: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recipientCount, smsCount]
                properties:
                  recipientCount: { type: integer }
                  smsCount: { type: integer, description: 'Recipients with a mobile number when sendSms=true (SMS goes to all targeted recipients regardless of push)' }
  /admin/v1/announcements/{announcementId}:
    parameters: [{ name: announcementId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getAdminAnnouncementsByAnnouncementId
      summary: Get Admin Announcements By Announcement Id
      tags: [Admin Announcements]
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAnnouncement' } } } }
    delete:
      operationId: deleteAdminAnnouncementsByAnnouncementId
      tags: [Admin Announcements]
      summary: Delete (scheduled → cancelled; sent → hidden from residents) (A5-AC6).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '204': { description: Deleted } }

  # ═══════════════════════ ADMIN — AUDIT & SHARED ═══════════════════════
  /admin/v1/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [Admin Audit]
      summary: Read-only view of admin actions in this compound (K-6, §8 Audit).
      security: [{ adminSession: [] }]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  nextCursor: { type: [string, 'null'] }
  /admin/v1/uploads:
    post:
      operationId: postAdminUploads
      tags: [Shared]
      summary: Get a signed upload URL (announcement attachment, compound logo).
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UploadInit' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }
  /admin/v1/categories:
    get:
      operationId: getAdminCategories
      summary: Get Admin Categories
      tags: [Shared]
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
  /admin/v1/events/stream:
    get:
      operationId: getAdminEventsStream
      tags: [Shared]
      summary: SSE stream of compound events (ADR-007). Event types request.created, request.updated, request.event_added, invitation.updated, announcement.updated.
      security: [{ adminSession: [] }]
      parameters: [{ name: Last-Event-ID, in: header, schema: { type: string } }]
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { $ref: '#/components/schemas/StreamEvent' } } } }

  # ═══════════════════════ APP — META (v1.1) ═══════════════════════
  /app/v1/meta:
    get:
      operationId: getAppMeta
      tags: [Shared]
      summary: Public. Minimum supported and latest app versions; the app calls it on start and forces an update below the minimum (v1.1).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [minSupportedVersion, latestVersion]
                properties:
                  minSupportedVersion:
                    type: object
                    required: [ios, android]
                    properties: { ios: { type: string, examples: ['1.0.0'] }, android: { type: string, examples: ['1.0.0'] } }
                  latestVersion:
                    type: object
                    required: [ios, android]
                    properties: { ios: { type: string }, android: { type: string } }

  # ═══════════════════════ APP — ACTIVATION (R1) ═══════════════════════
  /app/v1/invitations/{token}:
    get:
      operationId: getAppInvitationsByToken
      tags: [App Activation]
      summary: Preview a link — shows name, compound and unit read-only (R1-AC2). 410 if expired/used/revoked (R1-AC7).
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationPreview' } } } }
        '410': { description: 'code=invitation_expired | invitation_used | invitation_revoked; body includes compoundContactPhone', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /app/v1/activation/start:
    post:
      operationId: postAppActivationStart
      tags: [App Activation]
      summary: Start activation by token (link) or by invited phone/email (iOS deferred path, ADR-009). Sends OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [invitationToken], properties: { invitationToken: { type: string } } }
                - { type: object, required: [phone], properties: { phone: { $ref: '#/components/schemas/PhoneInput' } } }
                - { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: OTP sent (or generic response when no pending invite is found by phone/email), content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /app/v1/activation/complete:
    post:
      operationId: postAppActivationComplete
      tags: [App Activation]
      summary: Verify OTP, record PDPL consent (R1-AC4), activate all pending assignments for this person, issue tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, consent, device]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                consent:
                  type: object
                  required: [privacyNoticeVersion, termsVersion, locale]
                  properties:
                    privacyNoticeVersion: { type: string }
                    termsVersion: { type: string }
                    locale: { $ref: '#/components/schemas/Locale' }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '400': { description: 'code=otp_invalid | otp_expired | otp_attempts_exceeded', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'code=consent_version_outdated', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /app/v1/legal/{document}:
    get:
      operationId: getAppLegalByDocument
      tags: [App Activation]
      summary: Current privacy notice / terms text and version in the requested language.
      parameters:
        - { name: document, in: path, required: true, schema: { type: string, enum: [privacy_notice, terms] } }
        - { name: locale, in: query, required: true, schema: { $ref: '#/components/schemas/Locale' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [version, locale, html], properties: { version: { type: string }, locale: { $ref: '#/components/schemas/Locale' }, html: { type: string } } } } } }

  # ═══════════════════════ APP — AUTH (R0) ═══════════════════════
  /app/v1/auth/otp/start:
    post:
      operationId: postAppAuthOtpStart
      tags: [App Auth]
      summary: Sign in with mobile (or email if no mobile). Always 200 with a challenge (no enumeration); OTP only sent if an active person exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [phone], properties: { phone: { $ref: '#/components/schemas/PhoneInput' } } }
                - { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /app/v1/auth/otp/resend:
    post:
      operationId: postAppAuthOtpResend
      tags: [App Auth]
      summary: Max 3 resends per challenge (R1-AC3); also used during activation.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challengeId], properties: { challengeId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /app/v1/auth/otp/verify:
    post:
      operationId: postAppAuthOtpVerify
      summary: Post App Auth Otp Verify
      tags: [App Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, device]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: 'code=no_active_units (all assignments revoked)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /app/v1/auth/refresh:
    post:
      operationId: postAppAuthRefresh
      tags: [App Auth]
      summary: Rotate refresh token. Reuse of a rotated token revokes the whole family.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { description: 'code=session_revoked | refresh_expired', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /app/v1/auth/logout:
    post:
      operationId: postAppAuthLogout
      tags: [App Auth]
      security: [{ residentBearer: [] }]
      summary: Revokes this device's refresh-token family and clears its push token.
      responses: { '204': { description: Signed out } }

  # ═══════════════════════ APP — PROFILE, DEVICES ═══════════════════════
  /app/v1/me:
    get:
      operationId: getAppMe
      summary: Get App Me
      tags: [App Profile]
      security: [{ residentBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AppVersionHeader' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentMe' } } } }
        '426': { $ref: '#/components/responses/AppUpdateRequired' }
    patch:
      operationId: patchAppMe
      summary: Patch App Me
      tags: [App Profile]
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
                muteAnnouncements: { type: boolean, description: R5-AC5 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentMe' } } } }
  /app/v1/devices/current:
    put:
      operationId: putAppDevicesCurrent
      tags: [App Profile]
      summary: Register/refresh push token and permission state for the signed-in device.
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushEnabled]
              properties:
                pushToken: { type: [string, 'null'] }
                pushEnabled: { type: boolean }
                locale: { $ref: '#/components/schemas/Locale' }
                appVersion: { type: string }
      responses: { '204': { description: OK } }

  # ═══════════════════════ APP — REQUESTS (R2, R3, R4) ═══════════════════════
  /app/v1/categories:
    get:
      operationId: getAppCategories
      summary: Get App Categories
      tags: [App Requests]
      security: [{ residentBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
  /app/v1/uploads:
    post:
      operationId: postAppUploads
      tags: [App Requests]
      summary: Get a signed upload URL for a request or reopen photo (≤10 MB; client compresses and strips EXIF first).
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UploadInit' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /app/v1/units/{unitId}/requests:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    get:
      operationId: getAppUnitsByUnitIdRequests
      tags: [App Requests]
      summary: My unit's requests created by me (R3-AC1, Q-7).
      security: [{ residentBearer: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, closed, all], default: all } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ResidentRequestSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { description: 'code=unit_access_revoked', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: postAppUnitsByUnitIdRequests
      tags: [App Requests]
      summary: Create a facility request (R2). Replaying the same Idempotency-Key returns the original request with 200.
      security: [{ residentBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryCode, description]
              properties:
                categoryCode: { $ref: '#/components/schemas/CategoryCode' }
                description: { type: string, minLength: 10, maxLength: 1000 }
                locationInUnit: { type: string, maxLength: 100 }
                preferredSlot: { type: string, enum: [morning, afternoon, evening] }
                photoUploadIds: { type: array, maxItems: 5, items: { type: string, format: uuid } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /app/v1/requests/{requestId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getAppRequestsByRequestId
      summary: Get App Requests By Request Id
      tags: [App Requests]
      security: [{ residentBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /app/v1/requests/{requestId}/confirm:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: postAppRequestsByRequestIdConfirm
      tags: [App Requests]
      summary: Done → Closed (confirmed) (R4-AC2).
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /app/v1/requests/{requestId}/reopen:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: postAppRequestsByRequestIdReopen
      tags: [App Requests]
      summary: Done → In Progress with reason and up to 3 photos (R4-AC3).
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                photoUploadIds: { type: array, maxItems: 3, items: { type: string, format: uuid } }
                expectedVersion: { type: integer }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /app/v1/requests/{requestId}/cancel:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: postAppRequestsByRequestIdCancel
      tags: [App Requests]
      summary: Cancel while New (R2-AC6).
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentRequestDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  # ═══════════════════════ APP — ANNOUNCEMENTS & NOTIFICATIONS (R5) ═══════════════════════
  /app/v1/units/{unitId}/announcements:
    parameters: [{ $ref: '#/components/parameters/UnitId' }]
    get:
      operationId: getAppUnitsByUnitIdAnnouncements
      summary: Get App Units By Unit Id Announcements
      tags: [App Announcements]
      security: [{ residentBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ResidentAnnouncement' } }
                  nextCursor: { type: [string, 'null'] }
  /app/v1/announcements/{announcementId}:
    parameters: [{ name: announcementId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getAppAnnouncementsByAnnouncementId
      tags: [App Announcements]
      summary: Opening marks it read (A5-AC5 read count).
      security: [{ residentBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResidentAnnouncement' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /app/v1/notifications:
    get:
      operationId: getAppNotifications
      summary: Get App Notifications
      tags: [App Notifications]
      security: [{ residentBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
                  nextCursor: { type: [string, 'null'] }
  /app/v1/notifications/{notificationId}/read:
    post:
      operationId: postAppNotificationsByNotificationIdRead
      summary: Post App Notifications By Notification Id Read
      tags: [App Notifications]
      security: [{ residentBearer: [] }]
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: OK } }
  /app/v1/notifications/{notificationId}/received:
    post:
      operationId: postAppNotificationsByNotificationIdReceived
      tags: [App Notifications]
      summary: Push receipt acknowledgement from the app; cancels the pending SMS fallback (architecture §6).
      security: [{ residentBearer: [] }]
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: OK } }
  /app/v1/notifications/read-all:
    post:
      operationId: postAppNotificationsReadAll
      summary: Post App Notifications Read All
      tags: [App Notifications]
      security: [{ residentBearer: [] }]
      responses: { '204': { description: OK } }
  /app/v1/events/stream:
    get:
      operationId: getAppEventsStream
      tags: [App Notifications]
      summary: SSE stream for the signed-in person (request.updated, request.event_added, announcement.published, notification.created, session.revoked).
      description: Token in the `Authorization` header only. An `access_token` query parameter is not accepted (401).
      security: [{ residentBearer: [] }]
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { $ref: '#/components/schemas/StreamEvent' } } } }

  # ═══════════════════════ APP — PRIVACY (PDPL) ═══════════════════════
  /app/v1/privacy/requests:
    post:
      operationId: postAppPrivacyRequests
      tags: [App Privacy]
      summary: Data-subject request (access / correction / deletion) — K-6.
      security: [{ residentBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [access, correction, deletion] }
                details: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [received] }
                  dueAt: { type: string, format: date-time }

  # ═══════════════════════ WEBHOOKS & HEALTH ═══════════════════════
  /webhooks/sms/{provider}:
    post:
      operationId: postWebhooksSmsByProvider
      tags: [Webhooks]
      summary: SMS delivery receipts (Unifonic/Taqnyat). Authenticated by provider signature or shared secret + IP allow-list.
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [unifonic, taqnyat] } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } }, application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses: { '204': { description: Accepted } }
  /webhooks/email/{provider}:
    post:
      operationId: postWebhooksEmailByProvider
      tags: [Webhooks]
      summary: Email delivery / bounce events.
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '204': { description: Accepted } }
  /healthz:
    get:
      operationId: getHealthz
      summary: Get Healthz
      tags: [Shared]
      responses: { '200': { description: Live } }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-cs_admin
      description: Opaque session id; 30-min idle / 12-h absolute. Mutations also require X-CSRF-Token.
    residentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256, 15 min)

  parameters:
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    AppVersionHeader: { name: X-App-Version, in: header, required: false, description: 'Resident app semver; sent on every /app/v1 call (v1.1).', schema: { type: string, examples: ['1.0.0'] } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    UnitId: { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppUpdateRequired:
      description: 'code=app_update_required — X-App-Version is below minSupportedVersion (v1.1). May be returned by any /app/v1 operation except /app/v1/meta.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine code; clients map to localised text.
          examples: [validation_failed, unauthenticated, forbidden, not_found, rate_limited, account_locked, otp_invalid, otp_expired, otp_attempts_exceeded, invitation_expired, invitation_used, invitation_revoked, unit_number_taken, unit_in_use, no_owner_assigned, already_active, channel_unavailable, invite_limit_reached, invalid_transition, version_conflict, request_closed, edit_window_closed, unit_access_revoked, session_revoked, consent_version_outdated, visit_in_past, current_password_invalid, app_update_required]
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, code: { type: string } } }
        compoundContactPhone: { type: string, description: Present on invitation_* errors (R1-AC7) }

    Locale: { type: string, enum: [ar, en] }
    PhoneInput:
      type: string
      description: Saudi mobile; accepts +9665XXXXXXXX, 9665…, 05XXXXXXXX, 5XXXXXXXX, Arabic-Indic digits. Responses always E.164.
      maxLength: 20
    RequestStatus: { type: string, enum: [new, in_progress, done, closed, cancelled] }
    CloseReason: { type: [string, 'null'], enum: [confirmed, no_response, null] }
    CategoryCode: { type: string, enum: [plumbing, electrical, ac_hvac, carpentry_doors, painting_walls, pest_control, cleaning, other] }
    ActivationStatus: { type: string, enum: [not_invited, invited, failed, expired, active] }
    Channel: { type: string, enum: [push, sms, email] }
    DeliveryStatus: { type: string, enum: [queued, sent, delivered, failed, undelivered, skipped] }

    OtpChallenge:
      type: object
      required: [challengeId, channel, maskedDestination, expiresAt, resendsRemaining]
      properties:
        challengeId: { type: string, format: uuid }
        channel: { type: string, enum: [sms, email] }
        maskedDestination: { type: string, examples: ['+9665*****678'] }
        expiresAt: { type: string, format: date-time }
        resendsRemaining: { type: integer }
        resendAvailableAt: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, me]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        me: { $ref: '#/components/schemas/ResidentMe' }

    DeviceInput:
      type: object
      required: [installationId, platform]
      properties:
        installationId: { type: string, format: uuid, description: 'Generated once per install; stored in SecureStore' }
        platform: { type: string, enum: [ios, android] }
        appVersion: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }

    AdminMe:
      type: object
      required: [id, fullName, email, role, locale, compound]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [compound_admin] }
        locale: { $ref: '#/components/schemas/Locale' }
        compound: { $ref: '#/components/schemas/Compound' }

    Compound:
      type: object
      required: [id, nameAr, nameEn, contactPhone, timezone]
      properties:
        id: { type: string, format: uuid }
        nameAr: { type: string }
        nameEn: { type: string }
        logoUrl: { type: [string, 'null'], format: uri }
        contactPhone: { type: string }
        timezone: { type: string, examples: [Asia/Riyadh] }

    UnitInput:
      type: object
      required: [number, type]
      properties:
        number: { type: string, minLength: 1, maxLength: 30 }
        block: { type: [string, 'null'], maxLength: 30 }
        type: { type: string, enum: [villa, apartment, townhouse, other] }
        floor: { type: [string, 'null'], maxLength: 10 }
        notes: { type: [string, 'null'], maxLength: 500 }
    UnitPatch:
      allOf:
        - $ref: '#/components/schemas/UnitInput'
        - type: object
          properties:
            status: { type: string, enum: [active, inactive] }
      required: []
    OwnerInput:
      type: object
      required: [fullName]
      anyOf: [{ required: [phone] }, { required: [email] }]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { $ref: '#/components/schemas/PhoneInput' }
        email: { type: string, format: email }
        locale: { $ref: '#/components/schemas/Locale' }
    UnitSummary:
      type: object
      required: [id, number, type, status, activation, openRequestCount]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        block: { type: [string, 'null'] }
        type: { type: string }
        status: { type: string, enum: [active, inactive] }
        owner: { $ref: '#/components/schemas/OwnerSummary' }
        activation: { $ref: '#/components/schemas/ActivationStatus' }
        openRequestCount: { type: integer }
    OwnerSummary:
      type: [object, 'null']
      properties:
        personId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        locale: { $ref: '#/components/schemas/Locale' }
        activatedAt: { type: [string, 'null'], format: date-time }
    UnitDetail:
      allOf:
        - $ref: '#/components/schemas/UnitSummary'
        - type: object
          properties:
            floor: { type: [string, 'null'] }
            notes: { type: [string, 'null'] }
            latestInvitation: { oneOf: [{ $ref: '#/components/schemas/Invitation' }, { type: 'null' }] }
            invitesRemainingToday: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, channels, createdAt, expiresAt, state, deliveries]
      properties:
        id: { type: string, format: uuid }
        channels: { type: array, items: { type: string, enum: [sms, email] } }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time }
        state: { type: string, enum: [pending, used, expired, superseded, revoked] }
        deliveries: { type: array, items: { $ref: '#/components/schemas/Delivery' } }
    Delivery:
      type: object
      required: [channel, status, updatedAt]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        destinationMasked: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        failureReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    Category:
      type: object
      required: [code, nameAr, nameEn, icon]
      properties:
        code: { $ref: '#/components/schemas/CategoryCode' }
        nameAr: { type: string }
        nameEn: { type: string }
        icon: { type: string }

    Photo:
      type: object
      required: [id, url, width, height]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Signed GET URL valid 10 min }
        thumbnailUrl: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }

    VisitWindowInput:
      type: object
      required: [date, startTime, endTime]
      description: Local Asia/Riyadh wall-clock; server converts to UTC instants.
      properties:
        date: { type: string, format: date }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    VisitWindow:
      type: [object, 'null']
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    RequestEvent:
      type: object
      required: [id, type, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [created, status_changed, comment, visit_scheduled, visit_rescheduled, reopened, confirmed, auto_closed, cancelled] }
        actor:
          type: object
          properties:
            type: { type: string, enum: [admin, resident, system] }
            displayName: { type: string, description: 'Admin full name for admins; "Management"/"الإدارة" when shown to residents' }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/RequestStatus' }, { type: 'null' }] }
        toStatus: { oneOf: [{ $ref: '#/components/schemas/RequestStatus' }, { type: 'null' }] }
        body: { type: [string, 'null'] }
        visit: { $ref: '#/components/schemas/VisitWindow' }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, 'null'], format: date-time }
        editableUntil: { type: [string, 'null'], format: date-time }

    RequestCore:
      type: object
      required: [id, ref, unit, categoryCode, description, status, reopenCount, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ref: { type: string, examples: [REQ-00123] }
        unit: { type: object, properties: { id: { type: string, format: uuid }, number: { type: string }, block: { type: [string, 'null'] } } }
        categoryCode: { $ref: '#/components/schemas/CategoryCode' }
        description: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        closeReason: { $ref: '#/components/schemas/CloseReason' }
        reopenCount: { type: integer }
        visit: { $ref: '#/components/schemas/VisitWindow' }
        doneAt: { type: [string, 'null'], format: date-time }
        autoCloseAt: { type: [string, 'null'], format: date-time, description: doneAt + 7 days }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminRequestSummary:
      allOf:
        - $ref: '#/components/schemas/RequestCore'
        - type: object
          properties:
            residentName: { type: string }
            outcome: { type: [string, 'null'], enum: [awaiting_confirmation, reopened, confirmed, no_response, null] }
            photoCount: { type: integer }
    AdminRequestPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminRequestSummary' } }
        nextCursor: { type: [string, 'null'] }
    AdminRequestDetail:
      allOf:
        - $ref: '#/components/schemas/AdminRequestSummary'
        - type: object
          properties:
            locationInUnit: { type: [string, 'null'] }
            preferredSlot: { type: [string, 'null'], enum: [morning, afternoon, evening, null] }
            resident: { type: object, properties: { personId: { type: string, format: uuid }, fullName: { type: string }, phone: { type: [string, 'null'] }, email: { type: [string, 'null'] }, isCurrentOwner: { type: boolean } } }
            photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
            timeline: { type: array, items: { $ref: '#/components/schemas/RequestEvent' } }
            allowedTransitions: { type: array, items: { type: string, enum: [in_progress, done] } }
            canComment: { type: boolean }

    ResidentRequestSummary:
      allOf:
        - $ref: '#/components/schemas/RequestCore'
        - type: object
          properties:
            hasUnreadUpdates: { type: boolean }
    ResidentRequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestCore'
        - type: object
          properties:
            locationInUnit: { type: [string, 'null'] }
            preferredSlot: { type: [string, 'null'], enum: [morning, afternoon, evening, null] }
            photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
            timeline: { type: array, items: { $ref: '#/components/schemas/RequestEvent' } }
            allowedActions: { type: array, items: { type: string, enum: [confirm, reopen, cancel] } }

    Audience:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [all, blocks, units] }
        blocks: { type: array, items: { type: string } }
        unitIds: { type: array, items: { type: string, format: uuid } }
    AnnouncementInput:
      type: object
      required: [languages, audience]
      properties:
        languages: { type: string, enum: [ar, en, both] }
        titleAr: { type: string, maxLength: 80 }
        bodyAr: { type: string, maxLength: 2000 }
        titleEn: { type: string, maxLength: 80 }
        bodyEn: { type: string, maxLength: 2000 }
        attachmentUploadId: { type: [string, 'null'], format: uuid }
        audience: { $ref: '#/components/schemas/Audience' }
        sendSms: { type: boolean, default: false }
        scheduledAt: { type: [string, 'null'], format: date-time, description: Null = send now }
    AdminAnnouncement:
      type: object
      required: [id, status, audience, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [scheduled, sending, sent, deleted] }
        titleAr: { type: [string, 'null'] }
        bodyAr: { type: [string, 'null'] }
        titleEn: { type: [string, 'null'] }
        bodyEn: { type: [string, 'null'] }
        attachment: { type: [object, 'null'], properties: { url: { type: string, format: uri }, contentType: { type: string }, fileName: { type: string } } }
        audience: { $ref: '#/components/schemas/Audience' }
        sendSms: { type: boolean }
        scheduledAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        recipientCount: { type: [integer, 'null'] }
        readCount: { type: [integer, 'null'] }
        smsCount: { type: [integer, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ResidentAnnouncement:
      type: object
      required: [id, title, body, sentAt, isRead]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: "In the resident's locale if available; else the other language" }
        body: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        attachment: { type: [object, 'null'], properties: { url: { type: string, format: uri }, contentType: { type: string } } }
        sentAt: { type: string, format: date-time }
        isRead: { type: boolean }

    ResidentMe:
      type: object
      required: [personId, fullName, locale, muteAnnouncements, units]
      properties:
        personId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        locale: { $ref: '#/components/schemas/Locale' }
        muteAnnouncements: { type: boolean }
        consent:
          type: [object, 'null']
          description: Latest accepted privacy notice (v1.1); shown on the Privacy screen.
          properties:
            acceptedAt: { type: string, format: date-time }
            policyVersion: { type: string }
        units:
          type: array
          description: Active assignments only; drives the unit switcher (R0-AC3).
          items:
            type: object
            properties:
              unitId: { type: string, format: uuid }
              number: { type: string }
              block: { type: [string, 'null'] }
              compound: { $ref: '#/components/schemas/Compound' }

    InvitationPreview:
      type: object
      required: [fullName, compoundNameAr, compoundNameEn, unitNumber, otpChannel, maskedDestination]
      properties:
        fullName: { type: string }
        compoundNameAr: { type: string }
        compoundNameEn: { type: string }
        compoundLogoUrl: { type: [string, 'null'], format: uri }
        unitNumber: { type: string }
        block: { type: [string, 'null'] }
        otpChannel: { type: string, enum: [sms, email] }
        maskedDestination: { type: string }
        compoundPhone: { type: [string, 'null'], description: 'Compound contact phone, E.164 (v1.1)', examples: ['+966112345678'] }
        privacyNoticeVersion: { type: string }
        termsVersion: { type: string }

    Notification:
      type: object
      required: [id, type, title, createdAt, isRead]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [request_status_changed, request_comment, visit_scheduled, visit_rescheduled, visit_reminder, announcement, request_auto_closed, access_revoked] }
        title: { type: string, description: Rendered in the person's locale }
        body: { type: string }
        deepLink: { type: string, examples: ['compoundapp://requests/0b6e…', 'compoundapp://announcements/7a1c…'] }
        requestId: { type: [string, 'null'], format: uuid }
        announcementId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }

    UploadInit:
      type: object
      required: [purpose, contentType, bytes]
      properties:
        purpose: { type: string, enum: [request_photo, reopen_photo, announcement_attachment, compound_logo] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf] }
        bytes: { type: integer, minimum: 1, maximum: 10485760 }
    UploadTicket:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor: { type: object, properties: { type: { type: string }, displayName: { type: string } } }
        action: { type: string, examples: [unit.create, owner.assign, invitation.send, request.transition, announcement.send] }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        changes: { type: object }
        createdAt: { type: string, format: date-time }

    StreamEvent:
      type: object
      description: 'SSE frame: `id: <cursor>`, `event: <type>`, `data: <json>`. Data carries ids only — client refetches.'
      required: [type, entityId]
      properties:
        type: { type: string, enum: [request.created, request.updated, request.event_added, invitation.updated, announcement.updated, announcement.published, notification.created, session.revoked] }
        entityId: { type: string, format: uuid }
        version: { type: integer }
