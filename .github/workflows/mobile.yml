name: mobile
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/api-contract/**', 'packages/api-client/**', 'packages/domain/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @compound/domain --filter @compound/api-client build
      - run: pnpm typecheck
      - run: pnpm test --ci
      - run: npx expo-doctor
